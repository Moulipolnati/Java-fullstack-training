<!DOCTYPE html>
<html>
<head>
<title>Nested For Loop</title>
</head>

<body>

<h2>JavaScript Nested Loop Example</h2>

<script>

// Nested loop means a loop inside another loop

// Outer loop runs 3 times
for (let i = 1; i <= 3; i++) {

    // Inner loop runs 3 times for each outer loop
    for (let j = 1; j <= 3; j++) {

        document.write("i = " + i + " j = " + j + "<br>");

    }

    // Line break after inner loop finishes
    document.write("<br>");

}

</script>

</body>
</html>
