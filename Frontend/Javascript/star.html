<!DOCTYPE html>
<html>
<head>
<title>Star Pattern</title>
</head>

<body>

<h2>Star Pattern using Nested Loop</h2>

<script>

// This program prints a star pattern

// Outer loop controls number of rows
for (let i = 1; i <= 5; i++) {

    // Inner loop prints stars
    for (let j = 1; j <= i; j++) {

        document.write("* ");

    }

    // Move to next line after each row
    document.write("<br>");

}

</script>

</body>
</html>
