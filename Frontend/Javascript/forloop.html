<!DOCTYPE html>
<html>
<head>
<title>JavaScript For Loop</title>
</head>
<body>

<h2>JavaScript For Loop Example</h2>

<script>

// for loop syntax
// for(initialization; condition; increment)

for (let i = 1; i <= 5; i++) {

    // This prints numbers from 1 to 5
    console.log("Number: " + i);

}

</script>

</body>
</html>
