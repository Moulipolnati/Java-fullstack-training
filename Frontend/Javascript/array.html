<!DOCTYPE html>
<html>
<head>
<title>Array Basics</title>
</head>
<body>

<h2>JavaScript Array Basics</h2>

<script>

// Function to demonstrate array basics
function arrayBasics() {

    // Declare array
    let arr = [10, 20, 30, 40, 50];

    // Print full array
    document.write("Array: " + arr + "<br>");

    // Access elements
    document.write("First element: " + arr[0] + "<br>");
    document.write("Second element: " + arr[1] + "<br>");

    // Length of array
    document.write("Array length: " + arr.length + "<br>");

}

// Call function
arrayBasics();

</script>

</body>
</html>
