<!DOCTYPE html>
<html>
<head>
<title>Factorial</title>
</head>
<body>

<h2>Factorial using Function</h2>

<script>

// Function definition
function factorial() {

    let num = 5;
    let fact = 1;
    let i = 1;

    while (i <= num) {
        fact = fact * i;
        i++;
    }

    document.write("Factorial = " + fact);
}

// Function call
factorial();

</script>

</body>
</html>
