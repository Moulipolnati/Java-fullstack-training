<script>

function smallestElement() {

    let arr = [10, 45, 2, 99, 23];

    let min = arr[0];

    for (let i = 1; i < arr.length; i++) {

        if (arr[i] < min) {
            min = arr[i];
        }
    }

    document.write("Smallest element: " + min + "<br>");
}

smallestElement();

</script>
