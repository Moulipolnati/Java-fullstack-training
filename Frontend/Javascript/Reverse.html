<!DOCTYPE html>
<html>
<head>
<title>Reverse Number</title>
</head>
<body>

<h2>Reverse Number</h2>

<script>

// Function to reverse a number
function reverseNumber() {

    let num = 1234;
    let rev = 0;

    while (num > 0) {

        let digit = num % 10;
        rev = rev * 10 + digit;
        num = Math.floor(num / 10);

    }

    document.write("Reversed Number = " + rev);
}

// Calling function
reverseNumber();

</script>

</body>
</html>
