<!DOCTYPE html>
<html>
<head>
<title>Palindrome Check</title>
</head>
<body>

<h2>Palindrome Program</h2>

<script>

// Function to check palindrome
function palindrome() {

    let num = 121;
    let original = num;
    let rev = 0;

    while (num > 0) {

        let digit = num % 10;
        rev = rev * 10 + digit;
        num = Math.floor(num / 10);

    }

    if (original === rev) {
        document.write(original + " is Palindrome");
    } else {
        document.write(original + " is Not Palindrome");
    }
}

// Calling function
palindrome();

</script>

</body>
</html>
